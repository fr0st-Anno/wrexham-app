name: Update news and videos
on:
  schedule:
    # Intended every 30 minutes. GitHub Actions schedules can be delayed or skipped.
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public RSS and Atom feeds
        run: python scripts/update_feeds.py
      - name: Fetch Championship table, fixtures and squad (optional)
        id: sports
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_sports.py
      - name: Commit refreshed data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content.json data/sports.json data/sports-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Wrexham news and videos"
            git push
          fi
      - name: Report sports failure after preserving news updates
        if: steps.sports.outcome == 'failure'
        run: |
          echo "::error::Football data refresh failed. News was still saved. Check the FOOTBALL_DATA_TOKEN secret and provider access."
          exit 1
